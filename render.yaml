services:
  # -------------------------------------------------------------
  # 1. Medar NestJS API Backend (Web Service)
  # -------------------------------------------------------------
  - type: web
    name: medar-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm && pnpm install && pnpm prisma:generate && pnpm --filter @medar/config --filter @medar/types --filter @medar/validation build && pnpm --filter api build
    startCommand: npx prisma db push --skip-generate && node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medar-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "http://localhost:3000"

# -------------------------------------------------------------
# 2. PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: medar-postgres
    plan: free
    databaseName: medar_db
    user: medar_admin
    region: singapore
